name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      # Also proves the client bundle still embeds into a working executable,
      # which is the only artifact anyone actually runs.
      - name: Build the binary
        run: bun run build:binary

      - name: The binary starts, migrates and serves
        run: |
          GAMESHOWS_DB="$RUNNER_TEMP/ci.db" ./bin/gameshows --port 4321 --pin 123456 &
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:4321/api/health >/dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:4321/api/health | grep -q '"client":true'
          curl -sf http://127.0.0.1:4321/ | grep -q '<div id="root">'

  migrations:
    name: Migrations are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # Regenerating must be a no-op. If it writes a file, the schema was changed
      # without committing the migration that goes with it, and the binary would
      # ship code expecting columns its own migrations do not create.
      - name: Schema, migrations and the generated module agree
        run: |
          bun run db:generate
          if ! git diff --quiet --exit-code packages/db; then
            echo "::error::Schema changed but no migration was committed."
            echo "Run 'bun run db:generate' and commit the result:"
            git --no-pager diff --stat packages/db
            exit 1
          fi
          echo "Schema matches the committed migrations."
