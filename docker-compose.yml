# Postgres and realtime come from the Supabase CLI stack (`bunx supabase start`).
# This file only carries the pieces Supabase does not provide.
services:
  redis:
    image: redis:7-alpine
    container_name: gameshows-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: gameshows-srh
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '8089:80'
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
